<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selvam Medicals – Customers</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&family=Jersey+15&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar-header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/customers.css') }}">
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="left-panel">
    <div class="logo">
      <div class="SM">SM</div>
      <div class="logo-text"><p>Selvam</p><p>Medicals</p></div>
    </div>

    <select class="side-bar-dropdown">
      <option value="" disabled selected hidden>Timeline...</option>
      <option>Daily</option>
      <option>Weekly</option>
      <option>Monthly</option>
    </select>

    <p class="sec-label">MENU</p>

    <div class="row active">
      <div class="opt"><i class="fa-solid fa-chart-line"></i><p class="opt-text">Sales</p></div>
    </div>
    <div class="row">
      <div class="opt"><i class="fa-solid fa-cart-shopping"></i><p class="opt-text">Purchase</p></div>
    </div>
    <div class="row">
      <div class="opt"><i class="fa-solid fa-list"></i><p class="opt-text">Item</p></div>
    </div>
    <div class="row">
      <div class="opt"><i class="fa-solid fa-users"></i><p class="opt-text">Masters</p></div>
    </div>
    <div class="row">
      <div class="opt"><i class="fa-solid fa-desktop"></i><p class="opt-text">System</p></div>
    </div>
    <div class="row">
      <div class="opt"><i class="fa-solid fa-toolbox"></i><p class="opt-text">Utilities</p></div>
    </div>
    <div class="row sms">
      <div class="opt"><i class="fa-solid fa-comment-dots"></i><p class="opt-text">SMS</p></div>
    </div>

    <p class="sec-label other">OTHER</p>

    <div class="row settings">
      <div class="opt"><i class="fa-solid fa-gear"></i><p class="opt-text">Settings</p></div>
    </div>

    <div class="spacer"></div>

    <div class="row logout">
      <div class="opt"><i class="fa-solid fa-right-from-bracket"></i><p class="opt-text">Logout</p></div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main" id="mainPanel">

    <!-- HEADER -->
    <header class="header">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search">
      </div>
      <div class="fy">FY: 2026-2027</div>
      <div class="divider-1"></div>
      <div class="date-block">
        <span class="date-val" id="date-val"></span>
        <span class="day-val"  id="day-val"></span>
      </div>
      <div class="divider-2"></div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="divider-3"></div>
      <div class="user">
        <img src="{{ url_for('static', filename='images/user-profile.jpg') }}" alt="User">
        <span>Name</span>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <div class="content-area">

      <!-- BREADCRUMB -->
      <div class="breadcrumb-bar">
        <span class="breadcrumb-parent">Masters</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="#9CA3AF" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18L15 12L9 6"/>
        </svg>
        <span class="breadcrumb-current">Customer</span>
      </div>

      <!-- CUSTOMER CARD -->
      <div class="cust-content">
        <div class="cust-center-wrap">
          <div class="cust-card">

            <div class="cust-card-top-divider"></div>
            <div class="cust-card-body">
              <div class="cust-columns">

                <!-- LEFT COLUMN -->
                <div class="cust-column-left">

                  <div class="cust-field-row">
                    <label class="cust-field-label">Customer Code</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="customerCode" autocomplete="off">
                    </div>
                  </div>

                  <div class="cust-field-row">
                    <label class="cust-field-label">Customer Name</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="customerName" autocomplete="off">
                    </div>
                  </div>

                  <div class="cust-field-row">
                    <label class="cust-field-label">Address</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="address" autocomplete="off">
                    </div>
                  </div>

                  <div class="cust-field-row">
                    <label class="cust-field-label">Opening Bal.</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="openingBal" autocomplete="off">
                    </div>
                  </div>

                  <div class="cust-field-row">
                    <label class="cust-field-label">Mobile No</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="mobileNo" autocomplete="off">
                    </div>
                  </div>

                  <div class="cust-field-row">
                    <label class="cust-field-label">Allow Bills</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="allowBills" autocomplete="off">
                    </div>
                  </div>

                </div>

                <!-- RIGHT COLUMN -->
                <div class="cust-column-right">

                  <div class="cust-field-row">
                    <label class="cust-field-label">GSTIN No</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="gstinNo" autocomplete="off">
                    </div>
                  </div>

                  <div class="cust-field-row">
                    <label class="cust-field-label">Balance Amt</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="balanceAmount" autocomplete="off">
                    </div>
                  </div>

                  <div class="cust-field-row">
                    <label class="cust-field-label">Discount</label>
                    <span class="cust-colon">:</span>
                    <div class="cust-input-wrap">
                      <input class="cust-input" type="text" id="discount" autocomplete="off">
                    </div>
                  </div>

                </div>

              </div>
            </div>

            <!-- CARD FOOTER -->
            <div class="cust-card-divider"></div>
            <div class="cust-card-footer">
              <span class="cust-card-title" id="footerHelperText">Customer Setup</span>
            </div>

          </div>
        </div>
      </div>

      <!-- FOOTER (imported component) -->
      {% include 'footer.html' %}

    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/sidebar-header.js') }}"></script>
<script src="{{ url_for('static', filename='js/customers.js') }}"></script>
</body>
</html>
