<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheme Manager — Wholesale</title>
<style>
  :root{--bg:#0b0e16;--card:#141824;--border:#1e2535;--acc:#f97316;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--purple:#a855f7;--text:#e2e8f0;--muted:#64748b;--font:'Inter',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
  .topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;}
  .topbar a{color:var(--muted);font-size:.84rem;text-decoration:none;}
  .topbar a:hover{color:var(--text);}
  .topbar h1{font-size:1rem;font-weight:700;margin-left:auto;}
  .main{padding:24px;max-width:1000px;}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .kpi-val{font-size:1.5rem;font-weight:800;font-family:'JetBrains Mono',monospace;}
  .kpi-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-top:4px;}
  .kpi.blue .kpi-val{color:var(--blue);}
  .kpi.green .kpi-val{color:var(--green);}
  .kpi.orange .kpi-val{color:var(--acc);}
  .kpi.purple .kpi-val{color:var(--purple);}

  .scheme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:24px;}
  .scheme-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;transition:border-color .2s;}
  .scheme-card:hover{border-color:rgba(59,130,246,.4);}
  .scheme-card .active-dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--green);}
  .scheme-card .inactive-dot{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--muted);}
  .scheme-icon{font-size:2rem;margin-bottom:10px;}
  .scheme-title{font-size:.95rem;font-weight:700;margin-bottom:5px;}
  .scheme-desc{font-size:.8rem;color:var(--muted);margin-bottom:12px;line-height:1.5;}
  .scheme-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .stag{background:#1e2535;border-radius:12px;padding:3px 9px;font-size:.7rem;font-weight:600;color:var(--muted);}
  .stag.blue{background:rgba(59,130,246,.15);color:var(--blue);}
  .stag.green{background:rgba(34,197,94,.15);color:var(--green);}
  .stag.orange{background:rgba(249,115,22,.15);color:var(--acc);}
  .scheme-actions{display:flex;gap:6px;}
  .btn{padding:7px 14px;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;font-family:var(--font);}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-acc{background:var(--acc);color:#fff;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{font-size:1rem;font-weight:700;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;background:#0b0e16;border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-family:var(--font);font-size:.84rem;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);}
  .field textarea{resize:vertical;min-height:60px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-full{grid-column:1/-1;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-size:.84rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .hidden{display:none!important;}

  .type-template{background:#0d111a;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;}
  .type-template:hover,.type-template.selected{border-color:var(--blue);background:rgba(59,130,246,.08);}
  .type-template h4{font-size:.84rem;font-weight:700;margin-bottom:3px;}
  .type-template p{font-size:.75rem;color:var(--muted);}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="topbar">
  <a href="/wholesale">← Wholesale Portal</a>
  <span style="color:var(--border)">›</span>
  <h1>🎁 Scheme &amp; Offer Manager</h1>
  <button class="btn btn-acc" onclick="openAddScheme()" style="margin-left:16px;">+ New Scheme</button>
</div>
<div class="main">
  <div class="kpi-row">
    <div class="kpi blue"><div class="kpi-val" id="kActive">—</div><div class="kpi-lbl">Active Schemes</div></div>
    <div class="kpi green"><div class="kpi-val" id="kShops">—</div><div class="kpi-lbl">Shops Eligible</div></div>
    <div class="kpi orange"><div class="kpi-val" id="kExpiry">—</div><div class="kpi-lbl">Expiring Soon</div></div>
    <div class="kpi purple"><div class="kpi-val" id="kTotal">—</div><div class="kpi-lbl">Total Schemes</div></div>
  </div>

  <div class="scheme-grid" id="schemeGrid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Loading…</div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg hidden" id="schemeModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="schemeModalTitle">New Scheme</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="schemeId">
      <div class="form-grid">
        <div class="field form-full">
          <label>Scheme Title *</label>
          <input type="text" id="sTitle" placeholder="e.g. Buy 10 Get 1 Free on Antibiotics">
        </div>
        <div class="field form-full">
          <label>Description (shown to shops)</label>
          <textarea id="sDesc" placeholder="Describe the offer clearly…"></textarea>
        </div>
        <div class="field">
          <label>Scheme Type</label>
          <select id="sType">
            <option value="buy_x_get_y">Buy X Get Y Free</option>
            <option value="percent_off">% Discount on Category</option>
            <option value="flat_off">Flat Discount on Order</option>
            <option value="free_sample">Free Sample with Order</option>
            <option value="cash_back">Cash Back / Credit</option>
          </select>
        </div>
        <div class="field">
          <label>Icon Emoji</label>
          <input type="text" id="sIcon" placeholder="🎁" maxlength="4">
        </div>
        <div class="field">
          <label>Applies To (Category / "all")</label>
          <input type="text" id="sApplies" placeholder="e.g. Antibiotic or all">
        </div>
        <div class="field">
          <label>Value / Qty</label>
          <input type="text" id="sValue" placeholder="e.g. 10+1 or 15% or ₹500">
        </div>
        <div class="field">
          <label>Min Order Qty / Amount</label>
          <input type="text" id="sMinOrder" placeholder="e.g. 100 strips or ₹5000">
        </div>
        <div class="field">
          <label>Valid From</label>
          <input type="date" id="sFrom">
        </div>
        <div class="field">
          <label>Valid Till</label>
          <input type="date" id="sTill">
        </div>
        <div class="field">
          <label>Eligible Shops</label>
          <select id="sEligible">
            <option value="all">All Shops</option>
            <option value="wholesale">Wholesale Clients Only</option>
            <option value="retail">Retail Shops Only</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="sStatus">
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue" onclick="saveScheme()">Save Scheme</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
let schemes=[];

async function load(){
  const r=await fetch('/api/ws/schemes?all=1'); const d=await r.json();
  schemes=d.schemes||[];
  document.getElementById('kTotal').textContent=schemes.length;
  document.getElementById('kActive').textContent=schemes.filter(s=>s.is_active).length;
  document.getElementById('kShops').textContent='13'; // all shops by default
  const today=new Date().toISOString().slice(0,10);
  const expiring=schemes.filter(s=>s.valid_till&&s.valid_till>today&&s.valid_till<new Date(Date.now()+7*86400000).toISOString().slice(0,10)).length;
  document.getElementById('kExpiry').textContent=expiring;
  renderGrid();
}

function renderGrid(){
  const g=document.getElementById('schemeGrid');
  if(!schemes.length){g.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)">No schemes yet. Create your first offer!</div>`;return;}
  g.innerHTML=schemes.map(s=>`
    <div class="scheme-card">
      <div class="${s.is_active?'active-dot':'inactive-dot'}"></div>
      <div class="scheme-icon">${s.icon||'🎁'}</div>
      <div class="scheme-title">${s.title}</div>
      <div class="scheme-desc">${s.description||'—'}</div>
      <div class="scheme-meta">
        <span class="stag blue">${s.scheme_type||'offer'}</span>
        <span class="stag green">Applies: ${s.applies_to||'all'}</span>
        ${s.valid_till?`<span class="stag orange">Till ${s.valid_till}</span>`:''}
        ${s.eligible?`<span class="stag">${s.eligible}</span>`:''}
      </div>
      <div class="scheme-actions">
        <button class="btn btn-outline" onclick="openEdit(${s.id})">✏️ Edit</button>
        <button class="btn ${s.is_active?'btn-red':'btn-green'}" onclick="toggleScheme(${s.id},${s.is_active?0:1})">
          ${s.is_active?'Deactivate':'Activate'}
        </button>
      </div>
    </div>`).join('');
}

function openAddScheme(){
  document.getElementById('schemeModalTitle').textContent='New Scheme';
  document.getElementById('schemeId').value='';
  ['sTitle','sDesc','sIcon','sApplies','sValue','sMinOrder','sFrom','sTill'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('sType').value='buy_x_get_y';
  document.getElementById('sEligible').value='all';
  document.getElementById('sStatus').value='1';
  document.getElementById('schemeModal').classList.remove('hidden');
}
function openEdit(id){
  const s=schemes.find(x=>x.id===id);if(!s)return;
  document.getElementById('schemeModalTitle').textContent='Edit Scheme';
  document.getElementById('schemeId').value=s.id;
  document.getElementById('sTitle').value=s.title||'';
  document.getElementById('sDesc').value=s.description||'';
  document.getElementById('sType').value=s.scheme_type||'buy_x_get_y';
  document.getElementById('sIcon').value=s.icon||'';
  document.getElementById('sApplies').value=s.applies_to||'';
  document.getElementById('sValue').value=s.scheme_value||'';
  document.getElementById('sMinOrder').value=s.min_order||'';
  document.getElementById('sFrom').value=s.valid_from||'';
  document.getElementById('sTill').value=s.valid_till||'';
  document.getElementById('sEligible').value=s.eligible||'all';
  document.getElementById('sStatus').value=s.is_active?'1':'0';
  document.getElementById('schemeModal').classList.remove('hidden');
}
function closeModal(){document.getElementById('schemeModal').classList.add('hidden');}

async function saveScheme(){
  const id=document.getElementById('schemeId').value;
  const title=document.getElementById('sTitle').value.trim();
  if(!title){toast('Title required',true);return;}
  const payload={title,description:document.getElementById('sDesc').value.trim(),scheme_type:document.getElementById('sType').value,icon:document.getElementById('sIcon').value||'🎁',applies_to:document.getElementById('sApplies').value.trim()||'all',scheme_value:document.getElementById('sValue').value.trim(),min_order:document.getElementById('sMinOrder').value.trim(),valid_from:document.getElementById('sFrom').value,valid_till:document.getElementById('sTill').value,eligible:document.getElementById('sEligible').value,is_active:parseInt(document.getElementById('sStatus').value)};
  if(id){
    await fetch(`/api/ws/schemes/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  } else {
    await fetch('/api/ws/schemes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  }
  closeModal(); toast('Scheme saved ✓'); load();
}

async function toggleScheme(id,val){
  await fetch(`/api/ws/schemes/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:val})});
  toast(val?'Scheme activated ✓':'Scheme deactivated'); load();
}

function toast(msg,isErr=false){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(isErr?' error':'');
  setTimeout(()=>t.className='toast',2500);
}
load();
</script>
</body>
</html>
