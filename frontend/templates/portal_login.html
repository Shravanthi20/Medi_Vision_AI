<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Retail Pharmacy Login — MediVision AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Inter,sans-serif;background:#0b0e16;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(22,163,74,.08) 0%,transparent 60%);pointer-events:none;}
.card{background:#141824;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:40px;width:100%;max-width:420px;position:relative;z-index:1;box-shadow:0 24px 64px rgba(0,0,0,.4);}
.brand{text-align:center;margin-bottom:28px;}
.brand .ic{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#16a34a,#15803d);display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;margin-bottom:10px;}
.brand h1{font-size:1.4rem;font-weight:800;color:#fff;}
.brand p{color:#94a3b8;font-size:.88rem;margin-top:4px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.74rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.input{width:100%;background:#0b0e16;border:1.5px solid rgba(255,255,255,.1);border-radius:9px;padding:12px 14px;color:#e2e8f0;font-family:inherit;font-size:.95rem;}
.input:focus{outline:none;border-color:#16a34a;}
.btn{width:100%;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit;margin-top:6px;}
.btn:hover{opacity:.9;}
.demo-note{margin-top:16px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-radius:9px;padding:12px;font-size:.82rem;color:#cbd5e1;}
.demo-note strong{color:#4ade80;}
.alt{margin-top:14px;text-align:center;font-size:.85rem;color:#94a3b8;}
.alt a{color:#fb923c;font-weight:700;text-decoration:none;}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:.85rem;display:none;}
.err.show{display:block;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="ic"><i class="fas fa-store"></i></div>
    <h1>Retail Pharmacy Portal</h1>
    <p>Login to MediVision AI Dashboard</p>
  </div>

  <div class="err" id="err"></div>

  <div class="field">
    <label>Username</label>
    <input id="username" class="input" placeholder="sel" autocomplete="username"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input id="password" class="input" type="password" placeholder="demo123" autocomplete="current-password"/>
  </div>

  <button class="btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> &nbsp;Login</button>

  <div class="demo-note">
    <strong>📋 Demo credentials:</strong><br/>
    Username: <strong style="color:#fff;">sel</strong> &nbsp;·&nbsp; Password: <strong style="color:#fff;">demo123</strong>
  </div>

  <div class="alt">
    <a href="/wholesale-login">Wholesale Login →</a> &nbsp;·&nbsp;
    <a href="/internal">Staff POS →</a> &nbsp;·&nbsp;
    <a href="/welcome">← Home</a>
  </div>
</div>

<script>
async function doLogin(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const err = document.getElementById('err');
  err.classList.remove('show');
  if(!u || !p){ err.textContent = 'Enter username and password'; err.classList.add('show'); return; }

  try {
    const r = await fetch('/api/portal/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p}),
      credentials: 'include'
    });
    const d = await r.json();
    if(d.status === 'success'){
      window.location = '/portal/billing';
    } else {
      err.textContent = d.message || 'Invalid credentials';
      err.classList.add('show');
    }
  } catch(e){
    err.textContent = 'Connection error';
    err.classList.add('show');
  }
}

document.getElementById('password').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

// Pre-fill for fastest demo
document.getElementById('username').value = 'sel';
document.getElementById('password').value = 'demo123';
</script>
</body>
</html>
